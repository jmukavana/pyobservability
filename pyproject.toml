[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyobservability"
version = "0.1.0"
description = "Unified observability and auditing SDK for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jamlech Mukavana", email = "jamlechmukavana9@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["observability", "opentelemetry", "audit", "logging", "tracing", "metrics"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "opentelemetry-api>=1.45.2",
    "opentelemetry-instrumentation-openai>=0.63.0",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
]

[project.urls]
Homepage = "https://github.com/jmukavana/pyobservability"
Repository = "https://github.com/jmukavana/pyobservability"
Issues = "https://github.com/jmukavana/pyobservability/issues"
Changelog = "https://github.com/jmukavana/pyobservability/blob/main/CHANGELOG.md"

[project.optional-dependencies]
otlp = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]
http = [
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-requests>=0.66b2",
]
flask = [
    "flask>=3.0",
]
django = [
    "django>=4.2",
]
postgres = [
    "psycopg[binary,pool]>=3.2.10",
]
sqlalchemy = [
    "sqlalchemy>=2.0.45",
]
celery = [
    "celery>=5.4",
]
kafka = [
    "aiokafka>=0.13.0",
]
fastapi = [
    "fastapi>=0.115",
]
all = [
    "pyobservability[celery,django,fastapi,flask,http,kafka,otlp,postgres,sqlalchemy]",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
extras = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pyobservability[celery,django,flask,http,kafka,otlp,postgres,sqlalchemy]",
    "requests>=2.34.2",
]

[tool.uv]
default-groups = ["dev", "extras"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyobservability"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["django.*", "asgiref.*", "celery.*", "kombu.*", "aiokafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyobservability.integrations.django.apps"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--import-mode=importlib", "-p", "no:logging"]
filterwarnings = ["error"]
markers = [
    "integration: requires external services (testcontainers)",
    "security: secret and PII leakage tests",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["pyobservability"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.importlinter]
root_package = "pyobservability"

[[tool.importlinter.contracts]]
name = "Nothing imports integrations"
type = "forbidden"
source_modules = [
    "pyobservability.core",
    "pyobservability.context",
    "pyobservability.security",
    "pyobservability.logging",
    "pyobservability.tracing",
    "pyobservability.metrics",
    "pyobservability.audit",
    "pyobservability.exporters",
    "pyobservability.instrumentation",
]
forbidden_modules = ["pyobservability.integrations"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "pyobservability.integrations",
    "pyobservability.instrumentation",
    "pyobservability.logging | pyobservability.tracing | pyobservability.metrics | pyobservability.audit",
    "pyobservability.exporters",
    "pyobservability.security | pyobservability.context",
    "pyobservability.core",
]

[[tool.importlinter.contracts]]
name = "Telemetry and audit exporters stay independent"
type = "independence"
modules = [
    "pyobservability.exporters",
    "pyobservability.audit.exporters",
]

[tool.uv.sources]
pyobservability = { workspace = true }
