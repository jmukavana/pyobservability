# Grafana stack for PyObservability: Collector -> Prometheus (metrics), Tempo (traces), Loki (logs).
#   docker compose -f examples/grafana/docker-compose.yml up --build
# Then open http://localhost:3000 (anonymous admin, local demo only) and the "PyObservability" dashboard.
services:
  app:
    build:
      context: ../..
      dockerfile: examples/fastapi/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4317
      PYOBS_TRACING__EXPORTER: otlp
      PYOBS_METRICS__EXPORTER: otlp
      PYOBS_LOGGING__EXPORT_TO_OTEL: "true"
      PYOBS_METRICS__EXPORT_INTERVAL_MS: "5000"
    volumes:
      - audit-spool:/app/.audit-spool
    ports:
      - "8000:8000"
    depends_on:
      - collector

  traffic:
    image: curlimages/curl:8.11.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 8
        while true; do
          curl -s -o /dev/null -X POST "http://app:8000/claims/C-$$RANDOM/approve"
          curl -s -o /dev/null "http://app:8000/claims/missing"
          sleep 0.4
        done
    depends_on:
      - app

  collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - prometheus
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  audit-spool:
