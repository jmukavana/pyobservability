name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          if [ "${{ matrix.resolution }}" = "highest" ]; then
            uv sync --frozen
          else
            uv sync --resolution lowest-direct
          fi
      - name: Put the preinstalled PostgreSQL server binaries on PATH
        run: ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1 >> "$GITHUB_PATH"
      - name: Test
        run: uv run pytest --cov --cov-report=term

  without-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-group extras
      - name: Every module imports without optional extras
        run: uv run pytest tests/unit/test_package_imports.py tests/unit/test_public_api.py
